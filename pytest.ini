[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --maxfail=5

markers =
    smoke: 核心冒烟测试
    p0: 核心流程测试
    p1: 重要功能测试
    p2: 补充覆盖测试
    ui: 需要浏览器的 UI/E2E 测试
    api: 纯 HTTP API 测试
    auth: 需要认证测试账号
    slow: 运行时间较长的测试
