# Opt-in extension: docker compose --env-file .env -f docker-compose.yml -f docker-compose.media.yml up -d --build
services:
  backend:
    environment:
      MEDIA_PROCESSING_ENABLED: "true"
      MEDIA_REGISTRATION_ENABLED: "true"
      MEDIA_INTERNAL_SERVICE_TOKEN: ${MEDIA_INTERNAL_SERVICE_TOKEN:?Set a distinct random media service token}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  media-worker:
    build:
      context: ./services/media-service
    restart: unless-stopped
    read_only: true
    mem_limit: 640m
    memswap_limit: 640m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MEDIA_CORE_URL: http://backend:8080
      MEDIA_AMQP_URL: ${MEDIA_AMQP_URL:?Set the percent-encoded AMQP URL using the existing RabbitMQ account}
      MEDIA_INTERNAL_SERVICE_TOKEN: ${MEDIA_INTERNAL_SERVICE_TOKEN:?Set a distinct random media service token}
      GOMAXPROCS: "2"
      GOMEMLIMIT: 384MiB
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
