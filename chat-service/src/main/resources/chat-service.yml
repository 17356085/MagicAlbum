server:
  port: 8083

spring:
  application:
    name: chat-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:chat}
  jackson:
    time-zone: UTC
  datasource:
    url: ${CHAT_DB_URL:jdbc:mysql://localhost:3306/MagicAlbumChat?useSSL=false&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${CHAT_DB_USER:}
    password: ${CHAT_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/chat/mysql
    table: chat_flyway_schema_history
    user: ${CHAT_DB_MIGRATION_USER:${CHAT_DB_USER:}}
    password: ${CHAT_DB_MIGRATION_PASSWORD:${CHAT_DB_PASSWORD:}}
    clean-disabled: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:2000ms}
      repositories:
        enabled: false
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  rabbitmq:
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: ${app.rabbit.enabled:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: ${app.rabbit.enabled:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  chat:
    owner: local
    core-url: ${CHAT_CORE_URL:http://localhost:8080}
    internal-service-token: ${CHAT_INTERNAL_SERVICE_TOKEN:}
    allow-requests-default: ${APP_CHAT_ALLOW_REQUESTS_DEFAULT:true}
    nonfriend-daily-limit: ${APP_CHAT_NONFRIEND_DAILY_LIMIT:10}
  rate-limit:
    fail-closed: ${APP_RATE_LIMIT_FAIL_CLOSED:true}
  rabbit:
    enabled: ${APP_RABBIT_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5073,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5073,http://127.0.0.1:5173,http://127.0.0.1:5174}

chat:
  core-url: ${CHAT_CORE_URL:http://localhost:8080}
  internal-service-token: ${CHAT_INTERNAL_SERVICE_TOKEN:}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"
  level:
    root: INFO
