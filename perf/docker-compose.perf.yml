name: ${PERF_PROJECT_NAME:-bluealbum-perf-v2}

services:
  mysql_perf:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: MagicAlbum_perf
      MYSQL_USER: MagicAlbum
      MYSQL_PASSWORD: ${PERF_DB_PASSWORD:?Generate perf/.env.perf first}
      MYSQL_ROOT_PASSWORD: ${PERF_DB_ROOT_PASSWORD:?Generate perf/.env.perf first}
      MYSQL_EXPORTER_PASSWORD: ${PERF_MYSQL_EXPORTER_PASSWORD:?Generate perf/.env.perf first}
    volumes:
      - mysqlperfdata:/var/lib/mysql
      - ./docker/mysql/init-exporter.sh:/docker-entrypoint-initdb.d/01-exporter.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -u root -Nse 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis_perf:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${PERF_REDIS_PASSWORD:?Generate perf/.env.perf first}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq_perf:
    image: rabbitmq:3.13-management
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: bluealbum_perf
      RABBITMQ_DEFAULT_PASS: ${PERF_RABBITMQ_PASSWORD:?Generate perf/.env.perf first}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: perf,mysql
      DB_HOST: mysql_perf
      DB_PORT: 3306
      DB_NAME: MagicAlbum_perf
      DB_USER: MagicAlbum
      DB_PASSWORD: ${PERF_DB_PASSWORD:?Generate perf/.env.perf first}
      SPRING_RABBITMQ_HOST: rabbitmq_perf
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: bluealbum_perf
      SPRING_RABBITMQ_PASSWORD: ${PERF_RABBITMQ_PASSWORD:?Generate perf/.env.perf first}
      REDIS_HOST: redis_perf
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${PERF_REDIS_PASSWORD:?Generate perf/.env.perf first}
      JWT_SECRET: ${PERF_JWT_SECRET:?Generate perf/.env.perf first}
      JWT_ISSUER: MagicAlbum
      APP_AUTH_VERIFY_MODE: off
      AI_PROVIDER: mock
      NOTIFICATION_SERVICE_MODE: mock
      MANAGEMENT_PORT: 9090
      DB_LEAK_DETECT_MS: 20000
      JAVA_OPTS: ${PERF_JAVA_OPTS:--Xmx512m -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      mysql_perf:
        condition: service_healthy
      redis_perf:
        condition: service_healthy
      rabbitmq_perf:
        condition: service_healthy
    expose:
      - "8080"
      - "9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "127.0.0.1:8089:8080"
    command: ["--docker_only=true", "--housekeeping_interval=10s"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  mysqld_exporter:
    image: prom/mysqld-exporter:v0.15.1
    command: ["--mysqld.address=mysql_perf:3306", "--mysqld.username=exporter", "--config.my-cnf=/dev/null"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${PERF_MYSQL_EXPORTER_PASSWORD:?Generate perf/.env.perf first}
    depends_on:
      mysql_perf:
        condition: service_healthy
    ports:
      - "127.0.0.1:9104:9104"

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis_perf:6379
      REDIS_PASSWORD: ${PERF_REDIS_PASSWORD:?Generate perf/.env.perf first}
    depends_on:
      redis_perf:
        condition: service_healthy
    ports:
      - "127.0.0.1:9121:9121"

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "127.0.0.1:9099:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${PERF_GRAFANA_PASSWORD:?Generate perf/.env.perf first}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:0.51.0
    environment:
      PASSWORD: ${PERF_TEST_PASSWORD:?Generate perf/.env.perf first}
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    entrypoint: ["k6"]
    profiles: ["tools"]

volumes:
  mysqlperfdata:
  grafanadata:
