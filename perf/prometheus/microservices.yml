global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - microservices-alerts.yml

scrape_configs:
  - job_name: bluealbum-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9090"]

  - job_name: bluealbum-chat-realtime
    dns_sd_configs:
      - names: ["chat-realtime"]
        type: A
        port: 8092
        refresh_interval: 15s
