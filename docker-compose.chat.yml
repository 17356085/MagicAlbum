# Opt-in independent chat topology:
# docker compose --env-file .env -f docker-compose.yml -f docker-compose.chat.yml up -d --build
#
# The default Compose file remains a single-core deployment. This overlay adds
# a private chat database and sends only the chat business API to a second
# process; friends/blocks and the exact WebSocket endpoint remain on core/Go.
services:
  chat-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CHAT_DB_NAME:-bluealbum_chat}
      MYSQL_ROOT_PASSWORD: ${CHAT_DB_ROOT_PASSWORD:?CHAT_DB_ROOT_PASSWORD must be set in .env}
      CHAT_DB_NAME: ${CHAT_DB_NAME:-bluealbum_chat}
      CHAT_DB_USER: ${CHAT_DB_USER:?CHAT_DB_USER must be set in .env}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD must be set in .env}
      CHAT_DB_MIGRATION_USER: ${CHAT_DB_MIGRATION_USER:?CHAT_DB_MIGRATION_USER must be set in .env}
      CHAT_DB_MIGRATION_PASSWORD: ${CHAT_DB_MIGRATION_PASSWORD:?CHAT_DB_MIGRATION_PASSWORD must be set in .env}
      CHAT_DB_ROOT_PASSWORD: ${CHAT_DB_ROOT_PASSWORD:?CHAT_DB_ROOT_PASSWORD must be set in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - chatmysqldata:/var/lib/mysql
      - ./scripts/init-chat-db.sh:/docker-entrypoint-initdb.d/01-chat-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$CHAT_DB_PASSWORD\" mysql -h 127.0.0.1 -u \"$$CHAT_DB_USER\" \"$$CHAT_DB_NAME\" -Nse 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    image: ${BLUEALBUM_CHAT_SERVICE_IMAGE:-${COMPOSE_PROJECT_NAME}-chat-service:local}
    pull_policy: never
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8083
      CHAT_DB_NAME: ${CHAT_DB_NAME:-bluealbum_chat}
      CHAT_DB_URL: ${CHAT_DB_URL:-jdbc:mysql://chat-mysql:3306/${CHAT_DB_NAME:-bluealbum_chat}?useSSL=false&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&characterEncoding=utf8}
      SPRING_DATASOURCE_URL: ${CHAT_DB_URL:-jdbc:mysql://chat-mysql:3306/${CHAT_DB_NAME:-bluealbum_chat}?useSSL=false&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&characterEncoding=utf8}
      SPRING_DATASOURCE_USERNAME: ${CHAT_DB_USER:?CHAT_DB_USER must be set in .env}
      SPRING_DATASOURCE_PASSWORD: ${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD must be set in .env}
      SPRING_FLYWAY_URL: ${CHAT_DB_URL:-jdbc:mysql://chat-mysql:3306/${CHAT_DB_NAME:-bluealbum_chat}?useSSL=false&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&characterEncoding=utf8}
      SPRING_FLYWAY_USER: ${CHAT_DB_MIGRATION_USER:?CHAT_DB_MIGRATION_USER must be set in .env}
      SPRING_FLYWAY_PASSWORD: ${CHAT_DB_MIGRATION_PASSWORD:?CHAT_DB_MIGRATION_PASSWORD must be set in .env}
      SPRING_FLYWAY_LOCATIONS: classpath:db/chat/mysql
      CHAT_CORE_URL: ${CHAT_CORE_URL:-http://backend:8080}
      CHAT_INTERNAL_SERVICE_TOKEN: ${CHAT_INTERNAL_SERVICE_TOKEN:?CHAT_INTERNAL_SERVICE_TOKEN must be set in .env}
      CHAT_GOVERNANCE_INTERNAL_TOKEN: ${CHAT_GOVERNANCE_INTERNAL_TOKEN:?CHAT_GOVERNANCE_INTERNAL_TOKEN must be set in .env}
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:${COMPOSE_FRONTEND_PORT:-5173},http://127.0.0.1:${COMPOSE_FRONTEND_PORT:-5173}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      APP_RABBIT_ENABLED: "true"
      APP_CHAT_OWNER: local
    depends_on:
      chat-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    image: ${COMPOSE_PROJECT_NAME}-backend:local
    environment:
      APP_CHAT_OWNER: remote
      CHAT_INTERNAL_SERVICE_TOKEN: ${CHAT_INTERNAL_SERVICE_TOKEN:?CHAT_INTERNAL_SERVICE_TOKEN must be set in .env}
      CHAT_GOVERNANCE_INTERNAL_TOKEN: ${CHAT_GOVERNANCE_INTERNAL_TOKEN:?CHAT_GOVERNANCE_INTERNAL_TOKEN must be set in .env}
      CHAT_GOVERNANCE_URL: http://chat-service:8083

  gateway:
    environment:
      CHAT_SERVICE_GATEWAY_URI: http://chat-service:8083
    depends_on:
      chat-service:
        condition: service_healthy

volumes:
  chatmysqldata:
