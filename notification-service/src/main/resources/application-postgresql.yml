spring:
  config:
    activate:
      on-profile: postgresql
  datasource:
    url: ${NOTIFICATION_POSTGRES_DATASOURCE_URL:jdbc:postgresql://${NOTIFICATION_DB_HOST:${DB_HOST:localhost}}:${NOTIFICATION_DB_PORT:${DB_PORT:5432}}/${NOTIFICATION_DB_NAME:${DB_NAME:MagicAlbum}}}
    username: ${NOTIFICATION_POSTGRES_DATASOURCE_USERNAME:${NOTIFICATION_DB_USER:${DB_USER:}}}
    password: ${NOTIFICATION_POSTGRES_DATASOURCE_PASSWORD:${NOTIFICATION_DB_PASSWORD:${DB_PASSWORD:}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    database-type: postgresql
    locations: classpath:db/postgresql
