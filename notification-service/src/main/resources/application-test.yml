spring:
  datasource:
    url: jdbc:h2:mem:notification-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  application:
    name: bluealbum-notification-service-test
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false

app:
  security:
    jwt:
      secret: TestOnlyNotificationJwtSecretKey_0123456789
      issuer: bluealbum-notification-service-test
    internal-service-token: TestOnlyInternalServiceToken_0123456789
