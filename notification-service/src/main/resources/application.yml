server:
  port: ${NOTIFICATION_SERVICE_PORT:8081}

spring:
  application:
    name: bluealbum-notification-service
  profiles:
    default: local
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  datasource:
    url: ${NOTIFICATION_DATASOURCE_URL:jdbc:mysql://${NOTIFICATION_DB_HOST:${DB_HOST:localhost}}:${NOTIFICATION_DB_PORT:${DB_PORT:3306}}/${NOTIFICATION_DB_NAME:${DB_NAME:MagicAlbum}}?useSSL=false&serverTimezone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${NOTIFICATION_DATASOURCE_USERNAME:${DB_USER:}}
    password: ${NOTIFICATION_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: ${NOTIFICATION_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: notification_flyway_schema_history

app:
  security:
    jwt:
      secret: ${NOTIFICATION_JWT_SECRET:${JWT_SECRET:}}
      issuer: ${NOTIFICATION_JWT_ISSUER:${JWT_ISSUER:}}
    internal-service-token: ${NOTIFICATION_INTERNAL_SERVICE_TOKEN:${INTERNAL_SERVICE_TOKEN:}}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
