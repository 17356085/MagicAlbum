server:
  port: ${NOTIFICATION_SERVICE_PORT:8081}

spring:
  application:
    name: bluealbum-notification-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  datasource:
    url: ${NOTIFICATION_DATASOURCE_URL:jdbc:h2:file:./build/notification-db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${NOTIFICATION_DATASOURCE_USERNAME:sa}
    password: ${NOTIFICATION_DATASOURCE_PASSWORD:}
    driver-class-name: ${NOTIFICATION_DATASOURCE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
