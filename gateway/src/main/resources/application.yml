server:
  port: ${GATEWAY_PORT:9000}

home:
  bff:
    # The home composition endpoint is deliberately opt-in until its downstreams are verified.
    enabled: ${HOME_BFF_ENABLED:false}
    call-timeout: ${HOME_BFF_CALL_TIMEOUT:750ms}
    public-cache-ttl: ${HOME_BFF_PUBLIC_CACHE_TTL:2s}
    core-base-url: ${HOME_BFF_CORE_BASE_URL:http://127.0.0.1:8080}
    notification-base-url: ${HOME_BFF_NOTIFICATION_BASE_URL:http://127.0.0.1:8081}

spring:
  application:
    name: bluealbum-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:8s}
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
