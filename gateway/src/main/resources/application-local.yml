home:
  bff:
    core-base-url: ${HOME_BFF_CORE_BASE_URL:http://127.0.0.1:8080}
    notification-base-url: ${HOME_BFF_NOTIFICATION_BASE_URL:http://127.0.0.1:8081}

spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5073
                  - http://localhost:5173
                  - http://localhost:5174
                  - http://127.0.0.1:5073
                  - http://127.0.0.1:5173
                  - http://127.0.0.1:5174
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - X-Requested-With
                  - X-Device-Id
                  - X-Session-Id
                  - X-Request-Id
                  - Last-Event-ID
                allow-credentials: true
          routes:
            - id: notification-service-stream
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/notifications/stream
                - Method=GET,HEAD
              metadata:
                response-timeout: 65000
            - id: notification-service-api
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/events
                - Method=GET,HEAD
            - id: bluealbum-ai-api
              uri: http://127.0.0.1:8080
              predicates:
                - Path=/api/v1/ai/**
              metadata:
                response-timeout: 120000
            - id: bluealbum-monolith-api
              uri: http://127.0.0.1:8080
              predicates:
                - Path=/api/v1/**,/uploads/**
            - id: chat-realtime
              order: -1
              uri: ${CHAT_REALTIME_GATEWAY_URI:ws://127.0.0.1:8092}
              predicates:
                - Path=/api/v1/chat/realtime
            - id: notification-service-read
              order: -1
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/notifications/{id}/read
                - Method=PATCH
            - id: chat-service-api
              order: -2
              uri: ${CHAT_SERVICE_GATEWAY_URI:http://127.0.0.1:8080}
              predicates:
                - Path=/api/v1/chat/conversations/**,/api/v1/chat/direct/**,/api/v1/chat/groups/**,/api/v1/chat/settings
