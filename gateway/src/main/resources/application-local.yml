spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5073
                  - http://localhost:5173
                  - http://localhost:5174
                  - http://127.0.0.1:5073
                  - http://127.0.0.1:5173
                  - http://127.0.0.1:5174
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - X-Requested-With
                  - X-Device-Id
                  - X-Session-Id
                  - X-Request-Id
                  - Last-Event-ID
                allow-credentials: true
          routes:
            - id: notification-service-stream
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/notifications/stream
              metadata:
                response-timeout: 65000
            - id: notification-service-api
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/v1/notifications/**
            - id: bluealbum-ai-api
              uri: http://127.0.0.1:8080
              predicates:
                - Path=/api/v1/ai/**
              metadata:
                response-timeout: 120000
            - id: bluealbum-monolith-api
              uri: http://127.0.0.1:8080
              predicates:
                - Path=/api/v1/**,/uploads/**
