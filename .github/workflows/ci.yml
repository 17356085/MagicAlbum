name: CI

# 触发条件：推送到 main, master, dev 分支，或提交 Pull Request 时触发
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository structure tests
        run: node --test scripts/__tests__/*.test.mjs
      - name: Media runtime acceptance guard tests
        run: python -m unittest discover -s scripts/ci -p test_media_runtime_gate.py -v
      - name: Community runtime acceptance guard tests
        run: python -m unittest discover -s scripts/ci -p test_community_runtime_gate.py -v
      - name: Repository structure and references
        run: node scripts/Check-Repository.mjs
      - name: Java dependency boundaries
        run: node scripts/Check-JavaArchitecture.mjs
      - name: PowerShell source syntax
        shell: pwsh
        run: |
          $invalid = @()
          Get-ChildItem scripts, perf -Recurse -File -Include *.ps1, *.psm1 | ForEach-Object {
            $tokens = $null
            $syntaxErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$syntaxErrors) | Out-Null
            if ($syntaxErrors.Count) { $invalid += $_.FullName }
          }
          if ($invalid.Count) { throw "PowerShell syntax errors: $($invalid -join ', ')" }

  media-kernel:
    name: Go media worker and race checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/media-service
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOMEMLIMIT: 512MiB
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Formatting and static analysis
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
      - name: Execute media tests with race detection
        run: |
          mkdir -p "$GITHUB_WORKSPACE/outputs/m3-media-ci"
          go version > "$GITHUB_WORKSPACE/outputs/m3-media-ci/runtime.txt"
          go test -race -count=1 -json ./... > "$GITHUB_WORKSPACE/outputs/m3-media-ci/go-tests.jsonl"
      - name: Require executed tests without failures or skips
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE']) / 'outputs/m3-media-ci'
          events = [json.loads(line) for line in (root / 'go-tests.jsonl').read_text().splitlines() if line.strip()]
          passed = [event for event in events if event.get('Action') == 'pass' and event.get('Test')]
          packages = [event for event in events if event.get('Action') == 'pass' and not event.get('Test')]
          failures = [event for event in events if event.get('Action') == 'fail']
          skipped = [event for event in events if event.get('Action') == 'skip' and event.get('Test')]
          if not passed or not packages or failures or skipped:
              raise SystemExit('Media tests must execute and pass without failures or skips')
          summary = {'passedTestEvents': len(passed), 'packages': len(packages), 'failures': 0, 'skipped': 0, 'race': True}
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary))
          PY
      - name: Upload media kernel evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: media-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: outputs/m3-media-ci/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm exec vitest run --maxWorkers=1

      - name: Build
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 拉取代码

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run backend and service tests
        run: mvn -B test

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile test sources
        run: python -m compileall -q .

      - name: Collect tests
        run: pytest --collect-only -q

  content-event-mysql:
    name: Content event MySQL transactions and upgrade
    runs-on: ubuntu-latest
    needs: [repository, backend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verify isolated MySQL migrations, transactions and readback
        shell: pwsh
        run: ./scripts/Test-ContentEventRuntime.ps1 -MavenExecutable mvn -ArtifactDirectory "$PWD/outputs/m2-content-mysql"

      - name: Upload content event MySQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: content-event-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            outputs/m2-content-mysql/*.json
            outputs/m2-content-mysql/**/*.log
            outputs/m2-content-mysql/**/*.xml
            outputs/m2-content-mysql/**/*.txt

  runtime-browser:
    name: Runtime API and browser contracts
    runs-on: ubuntu-latest
    needs: [repository, frontend, backend, python-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install browser test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Warm Selenium Manager Chrome resolution
        run: |
          python - <<'PY'
          from tests.e2e.selenium.utils.driver_factory import DriverFactory

          driver = DriverFactory.create_driver("chrome")
          try:
              driver.get("data:text/html,<title>selenium-ready</title>")
              if driver.title != "selenium-ready":
                  raise SystemExit("Selenium Manager Chrome smoke did not load a document")
          finally:
              driver.quit()
          PY

      - name: Install bundled Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build and verify isolated API and browser contracts
        run: bash scripts/ci/compose-browser-smoke.sh

      - name: Upload runtime browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-browser-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            outputs/m0-ci/junit.xml
            outputs/m0-ci/api-junit.xml
            outputs/m0-ci/selenium-junit.xml
            outputs/m0-ci/ui-junit.xml
            outputs/m0-ci/screenshots/*.png
            outputs/m0-ci/logs/**

  content-search:
    name: Content search delivery, rebuild and recovery
    runs-on: ubuntu-latest
    needs: [repository, backend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify MySQL, RabbitMQ and Elasticsearch with real outages
        run: bash scripts/ci/content-search-smoke.sh
      - name: Upload search recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: content-search-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            outputs/m2-search-ci/*.json
            outputs/m2-search-ci/**/*.json
            outputs/m2-search-ci/**/*.xml
            outputs/m2-search-ci/**/*.txt
            outputs/m2-search-ci/**/*.log

  community-runtime:
    name: Community permissions, moderation recovery and audit
    runs-on: ubuntu-latest
    needs: [repository, backend, frontend, media-kernel, python-tests]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install acceptance dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Install acceptance browser
        run: python -m playwright install --with-deps chromium
      - name: Verify real community permissions, SQL readback and mobile flows
        run: python scripts/ci/community-runtime-smoke.py
      - name: Require complete community and cleanup evidence
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET
          spec = importlib.util.spec_from_file_location('m4_gate', 'scripts/ci/community-runtime-smoke.py')
          gate = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = gate
          spec.loader.exec_module(gate)
          reports = list(Path('outputs/m4-runtime-ci').glob('*/junit.xml'))
          if len(reports) != 1:
              raise SystemExit('Exactly one isolated M4 community report is required')
          report = ET.parse(reports[0]).getroot()
          cases = report.findall('testcase')
          checks = json.loads(reports[0].with_name('checks.json').read_text())
          if [case.get('name') for case in cases] != list(gate.PLANNED_CASES):
              raise SystemExit('M4 requires every planned case exactly once and in order')
          if any(case.find(kind) is not None for case in cases for kind in ('failure', 'error', 'skipped')):
              raise SystemExit('M4 community cases failed or skipped')
          if checks['status'] != 'passed' or checks['cleanup'] != 'passed' or len(checks['screenshots']) != 8:
              raise SystemExit('M4 cleanup or eight browser screenshots are incomplete')
          print(f'M4 community: {len(cases)} executed cases, eight screenshots and isolated cleanup passed')
          PY
      - name: Upload community permission and recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: community-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            outputs/m4-runtime-ci/**/*.json
            outputs/m4-runtime-ci/**/*.xml
            outputs/m4-runtime-ci/**/logs/*.log
            outputs/m4-runtime-ci/**/screenshots/*.png

  media-runtime:
    name: Media worker recovery and notification streams
    runs-on: ubuntu-latest
    needs: [repository, backend, frontend, media-kernel, python-tests]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install acceptance dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Install acceptance browser
        run: python -m playwright install --with-deps chromium
      - name: Verify cross-language media, outages and notification replay
        run: python scripts/ci/media-runtime-smoke.py
      - name: Require complete runtime and cleanup evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('outputs/m3-runtime-ci').glob('*/junit.xml'))
          if len(reports) != 1:
              raise SystemExit('Exactly one isolated M3 runtime report is required')
          report = ET.parse(reports[0]).getroot()
          cases = report.findall('testcase')
          checks = json.loads(reports[0].with_name('checks.json').read_text())
          if len(cases) != 16 or any(case.find(kind) is not None for case in cases for kind in ('failure', 'error', 'skipped')):
              raise SystemExit('M3 requires 16 actual cases with no failures, errors or skips')
          if checks['status'] != 'passed' or checks['cleanup'] != 'passed':
              raise SystemExit('M3 runtime cleanup did not pass')
          auth = json.loads(reports[0].with_name('worker-auth-pause.json').read_text())
          if (auth.get('pausedReadyStatus') != 503 or auth.get('pausedLiveStatus') != 200
              or auth.get('pauseEvents') != 1 or auth.get('pausedQueueConsumers') != 0
              or auth.get('observedPauseSeconds', 0) < 12 or auth.get('pausedJobAttempts') != 0
              or auth.get('recoveredJobAttempts') != 1 or auth.get('recoveredStatus') != 'SUCCEEDED'
              or auth.get('previewBytes', 0) < 1):
              raise SystemExit('M3 authentication pause and durable recovery evidence is incomplete')
          print('M3 runtime: 16 executed cases and isolated cleanup passed')
          PY
      - name: Upload media and stream evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: media-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            outputs/m3-runtime-ci/**/*.json
            outputs/m3-runtime-ci/**/*.xml
            outputs/m3-runtime-ci/**/logs/*.log
            outputs/m3-runtime-ci/**/screenshots/*.png

  summary-runtime:
    name: Summary task provider, budget and lifecycle runtime
    runs-on: ubuntu-latest
    needs: [repository, backend, frontend, media-kernel, python-tests]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Run offline summary runtime guards
        run: python -m unittest discover -s scripts/ci -p test_summary_runtime_gate.py -v
      - name: Install summary acceptance dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Install acceptance browser
        run: python -m playwright install --with-deps chromium
      - name: Verify real MySQL, RabbitMQ, controlled provider and summary browser flows
        run: python scripts/ci/summary-runtime-smoke.py
      - name: Require complete M4B evidence without skips
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          spec = importlib.util.spec_from_file_location('m4b_gate', 'scripts/ci/summary-runtime-smoke.py')
          gate = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = gate
          spec.loader.exec_module(gate)
          reports = list(Path('outputs/m4b-runtime-ci').glob('*/junit.xml'))
          if len(reports) != 1:
              raise SystemExit('Exactly one isolated M4B summary report is required')
          report = ET.parse(reports[0]).getroot()
          cases = report.findall('testcase')
          checks = json.loads(reports[0].with_name('checks.json').read_text())
          if [case.get('name') for case in cases] != list(gate.PLANNED_CASES):
              raise SystemExit('M4B requires every planned case exactly once and in order')
          if any(case.find(kind) is not None for case in cases for kind in ('failure', 'error', 'skipped')):
              raise SystemExit('M4B summary cases failed or skipped')
          if checks['status'] != 'passed' or checks['cleanup'] != 'passed' or checks['externalModelProven'] is not False:
              raise SystemExit('M4B status, cleanup or external-model boundary is incomplete')
          if len(checks.get('screenshots', [])) != 4:
              raise SystemExit('M4B requires four actual browser screenshots')
          print(f"M4B summary: {len(cases)} executed cases, four screenshots, controlled fixture only, cleanup passed")
          PY
      - name: Upload summary task and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: summary-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            outputs/m4b-runtime-ci/**/*.json
            outputs/m4b-runtime-ci/**/*.xml
            outputs/m4b-runtime-ci/**/logs/*.log
            outputs/m4b-runtime-ci/**/screenshots/*.png

  restore-runtime:
    name: Independent database, permissions and summary restore
    runs-on: ubuntu-latest
    needs: [repository, frontend, backend, python-tests]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Check restore evidence guards
        run: python -m unittest discover -s scripts/ci -p test_restore_evidence.py -v
      - name: Install browser dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Warm Selenium Chrome and install Playwright Chromium
        run: |
          python - <<'PY'
          from tests.e2e.selenium.utils.driver_factory import DriverFactory
          driver = DriverFactory.create_driver('chrome')
          try:
              driver.get('data:text/html,<title>restore-ready</title>')
              if driver.title != 'restore-ready':
                  raise SystemExit('Chrome did not load the restore preflight')
          finally:
              driver.quit()
          PY
          python -m playwright install --with-deps chromium
      - name: Build, execute browser contracts and restore into a second isolated stack
        shell: pwsh
        run: |
          $pythonExecutable = (Get-Command python).Source
          ./scripts/Test-ComposeRuntime.ps1 -PythonExecutable $pythonExecutable -BrowserChannel '' -IncludeStageFixtures -ArtifactDirectory (Join-Path $PWD 'outputs/restore-ci')
      - name: Require database, upload, stage readback and cleanup evidence
        run: python scripts/ci/check-restore-evidence.py outputs/restore-ci
      - name: Upload sanitized restore evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: restore-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            outputs/restore-ci/checks.json
            outputs/restore-ci/*-junit.xml
            outputs/restore-ci/browser-results.xml
            outputs/restore-ci/stage-*.json
            outputs/restore-ci/*host*.json
            outputs/restore-ci/*.log
            outputs/restore-ci/browser/**/*.png
            outputs/restore-ci/backup/*/verification-summary.json
            outputs/restore-ci/backup/*/*sha256.json
