name: CI

# 触发条件：推送到 main, master, dev 分支，或提交 Pull Request 时触发
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repository structure tests
        run: node --test scripts/__tests__/*.test.mjs
      - name: Repository structure and references
        run: node scripts/Check-Repository.mjs
      - name: Java dependency boundaries
        run: node scripts/Check-JavaArchitecture.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm exec vitest run --maxWorkers=1 --minWorkers=1

      - name: Build
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 拉取代码

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run backend and service tests
        run: mvn -B test

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile test sources
        run: python -m compileall -q .

      - name: Collect tests
        run: pytest --collect-only -q

  runtime-browser:
    name: Runtime browser smoke
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install browser test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Install bundled Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build and run isolated Compose browser journey
        run: bash scripts/ci/compose-browser-smoke.sh

      - name: Upload runtime browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-browser-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            outputs/m0-ci/junit.xml
            outputs/m0-ci/screenshots/*.png
            outputs/m0-ci/logs/**
