# Reliable notification outbox defaults. Environment/application config may override these values.
app.notifications.outbox.poll-interval-ms=2000
app.notifications.outbox.batch-size=50
app.notifications.outbox.lease-duration=30s
app.notifications.outbox.max-attempts=5
app.notifications.outbox.backoff-base=2s
app.notifications.outbox.retention=7d
