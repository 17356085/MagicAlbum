spring:
  application:
    name: bluealbum-monolith
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  data:
    redis:
      repositories:
        enabled: false
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:MagicAlbum}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql

app:
  admin:
    email: ${APP_ADMIN_EMAIL:}
  rate-limit:
    fail-closed: false
  auth:
    verify:
      mode: off
  notifications:
    client:
      mode: remote
      enabled: true
      base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8081}
      internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
  ai:
    rate-limit:
      fail-closed: false
  rabbit:
    enabled: ${APP_RABBIT_ENABLED:false}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl-minutes: 120

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

management:
  health:
    rabbit:
      enabled: ${APP_RABBIT_ENABLED:false}

ai:
  provider: mock
