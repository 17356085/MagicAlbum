server:
  port: 8080

spring:
  config:
    import: optional:file:.env.local[.properties],optional:file:backend/.env.local[.properties]
  application:
    name: bluealbum-monolith
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql} # 本地与生产统一使用 MySQL；云环境可启用 cloud profile
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # 使用 Flyway 管理 schema
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  datasource:
    # 默认使用 MySQL；账号、密码只从环境变量注入
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:MagicAlbum}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:2000ms}
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  rabbitmq:
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: ${app.rabbit.enabled:false}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: false
  health:
    rabbit:
      enabled: ${app.rabbit.enabled:false}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  deployment:
    # Multi-instance deployments must share Redis and uploads; startup rejects local-only state.
    multi-instance: ${APP_MULTI_INSTANCE:false}
  rate-limit:
    fail-closed: ${APP_RATE_LIMIT_FAIL_CLOSED:true}
  ai:
    max-concurrent-per-user: ${AI_MAX_CONCURRENT_PER_USER:2}
    max-context-chars: ${AI_MAX_CONTEXT_CHARS:12000}
    rate-limit:
      fail-closed: ${APP_AI_RATE_LIMIT_FAIL_CLOSED:true}
  auth:
    verify:
      # off: 不校验；mock: 校验 mock 票据；turnstile: 调用 Cloudflare Turnstile siteverify
      mode: ${APP_AUTH_VERIFY_MODE:turnstile}
      turnstile:
        secret-key: ${TURNSTILE_SECRET_KEY:}
        site-key: ${TURNSTILE_SITE_KEY:}
        verify-url: ${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
        expected-hostname: ${TURNSTILE_EXPECTED_HOSTNAME:localhost}
    qr:
      ttl-seconds: ${APP_AUTH_QR_TTL_SECONDS:60}
      url-prefix: ${APP_AUTH_QR_URL_PREFIX:magicalbum://auth/qr/}
    oauth:
      frontend-callback-url: ${APP_AUTH_OAUTH_FRONTEND_CALLBACK_URL:http://localhost:5173/auth/oauth/callback}
      state-ttl-seconds: ${APP_AUTH_OAUTH_STATE_TTL_SECONDS:300}
      github:
        client-id: ${GITHUB_OAUTH_CLIENT_ID:}
        client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
        redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:9000/api/v1/auth/oauth/callback/github}
        scope: ${GITHUB_OAUTH_SCOPE:read:user user:email}
      google:
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:9000/api/v1/auth/oauth/callback/google}
        scope: ${GOOGLE_OAUTH_SCOPE:openid email profile}
      apple:
        client-id: ${APPLE_OAUTH_CLIENT_ID:}
        team-id: ${APPLE_OAUTH_TEAM_ID:}
        key-id: ${APPLE_OAUTH_KEY_ID:}
        private-key: ${APPLE_OAUTH_PRIVATE_KEY:}
        redirect-uri: ${APPLE_OAUTH_REDIRECT_URI:http://localhost:9000/api/v1/auth/oauth/callback/apple}
        scope: ${APPLE_OAUTH_SCOPE:name email}
        client-secret-ttl-seconds: ${APPLE_OAUTH_CLIENT_SECRET_TTL_SECONDS:15768000}
      wechat:
        app-id: ${WECHAT_OAUTH_APP_ID:}
        app-secret: ${WECHAT_OAUTH_APP_SECRET:}
        redirect-uri: ${WECHAT_OAUTH_REDIRECT_URI:http://localhost:9000/api/v1/auth/oauth/callback/wechat}
        scope: ${WECHAT_OAUTH_SCOPE:snsapi_login}
    cognito:
      region: ${COGNITO_REGION:ap-southeast-1}
      user-pool-id: ${COGNITO_USER_POOL_ID:}
      app-client-id: ${COGNITO_APP_CLIENT_ID:}
      app-client-secret: ${COGNITO_APP_CLIENT_SECRET:}
      email-otp-expire-seconds: ${COGNITO_EMAIL_OTP_EXPIRE_SECONDS:300}
      phone-otp-expire-seconds: ${COGNITO_PHONE_OTP_EXPIRE_SECONDS:300}
      send-cooldown-seconds: ${COGNITO_SEND_COOLDOWN_SECONDS:60}
  rabbit:
    enabled: ${APP_RABBIT_ENABLED:false}
  search:
    enabled: ${APP_SEARCH_ENABLED:false}
    consumer:
      enabled: ${APP_SEARCH_CONSUMER_ENABLED:true}
      max-attempts: ${APP_SEARCH_CONSUMER_MAX_ATTEMPTS:3}
      backoff-ms: ${APP_SEARCH_CONSUMER_BACKOFF_MS:250}
    elasticsearch:
      url: ${ELASTICSEARCH_URL:http://127.0.0.1:9200}
      api-key: ${ELASTICSEARCH_API_KEY:}
      connect-timeout: ${ELASTICSEARCH_CONNECT_TIMEOUT:1s}
      read-timeout: ${ELASTICSEARCH_READ_TIMEOUT:2s}
      replicas: ${ELASTICSEARCH_REPLICAS:1}
  content:
    events:
      enabled: ${APP_CONTENT_EVENTS_ENABLED:false}
      publisher-scheduler-enabled: ${APP_CONTENT_EVENTS_PUBLISHER_SCHEDULER_ENABLED:true}
      batch-size: ${APP_CONTENT_EVENTS_BATCH_SIZE:20}
      max-attempts: ${APP_CONTENT_EVENTS_MAX_ATTEMPTS:5}
      backoff-base: ${APP_CONTENT_EVENTS_BACKOFF_BASE:2s}
      lease-duration: ${APP_CONTENT_EVENTS_LEASE_DURATION:30s}
      confirm-timeout: ${APP_CONTENT_EVENTS_CONFIRM_TIMEOUT:5s}
      connection-timeout: ${APP_CONTENT_EVENTS_CONNECTION_TIMEOUT:5s}
      commit-margin: ${APP_CONTENT_EVENTS_COMMIT_MARGIN:2s}
      poll-interval-ms: ${APP_CONTENT_EVENTS_POLL_INTERVAL_MS:2000}
  notifications:
    client:
      mode: ${NOTIFICATION_SERVICE_MODE:remote}
      enabled: ${APP_NOTIFICATIONS_CLIENT_ENABLED:true}
      internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
      base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8081}
  security:
    jwt:
      issuer: ${JWT_ISSUER:MagicAlbum}
      secret: ${JWT_SECRET:}
      access-token-ttl-minutes: 120
  storage:
    s3:
      # 默认关闭：将这些值留空，避免误判为已配置，后端会自动回退到本地存储
      bucket: ""
      region: ""
      endpoint: "" # 可选：S3 兼容对象存储自定义 endpoint，例如 https://s3.amazonaws.com 或 MinIO/自建网关
      accessKey: ""
      secretKey: ""
      # 公开 CDN URL；留空返回应用内稳定地址，读取时签名，支持私有 bucket。
      publicBaseUrl: ""
      # 默认私有对象；公开展示应通过受控 CDN/签名 URL 暴露
      aclPublicRead: false
      # 路径前缀，按日期分目录
      pathPrefix: threads
    local:
      shared: ${APP_STORAGE_LOCAL_SHARED:false}
      # 本地存储目录（相对于项目根目录或绝对路径）
      baseDir: uploads
ai:
  # 生产必须显式配置 real + AI_API_KEY；mock 只能由 local/test profile 显式打开
  provider: ${AI_PROVIDER:real}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
  model: ${AI_MODEL:doubao-1-5-pro-32k-250115}
  request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:30}
