spring:
  config:
    import:
      - optional:nacos:bluealbum-monolith-local.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  application:
    name: bluealbum-monolith
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_CONFIG_NAMESPACE:}
        health-indicator:
          enabled: true
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_DISCOVERY_NAMESPACE:}
        health-indicator:
          enabled: true
  data:
    redis:
      repositories:
        enabled: false
  datasource:
    url: jdbc:h2:file:./build/h2db;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

app:
  rabbit:
    enabled: false
  schema-fixer:
    enabled: false
  security:
    jwt:
      secret: LocalDevOnlyJwtSecretKey_ForBlueAlbum_0123456789
      access-token-ttl-minutes: 120

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG

management:
  health:
    rabbit:
      enabled: false
