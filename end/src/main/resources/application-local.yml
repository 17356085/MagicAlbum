spring:
  data:
    redis:
      repositories:
        enabled: false
  datasource:
    url: jdbc:h2:file:./build/h2db;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

app:
  rabbit:
    enabled: false
  schema-fixer:
    enabled: false
  security:
    jwt:
      secret: LocalDevOnlyJwtSecretKey_ForBlueAlbum_0123456789
      access-token-ttl-minutes: 120

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG

management:
  health:
    rabbit:
      enabled: false
