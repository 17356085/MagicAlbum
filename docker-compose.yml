version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: MagicAlbum-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: MagicAlbum
      POSTGRES_USER: MagicAlbum
      POSTGRES_PASSWORD: MagicAlbum
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: MagicAlbum-mysql
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: MagicAlbum
      MYSQL_USER: MagicAlbum
      MYSQL_PASSWORD: MagicAlbum
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: MagicAlbum-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:management
    container_name: MagicAlbum-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: MagicAlbum-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_TOKEN: "Qmx1ZUFsYnVtTG9jYWxEZXZPbmx5TmFjb3NUb2tlbl9DaGFuZ2VJblByb2R1Y3Rpb24="
      NACOS_AUTH_IDENTITY_KEY: "bluealbum-nacos-identity"
      NACOS_AUTH_IDENTITY_VALUE: "bluealbum-local-dev"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "18080:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacosdata:/home/nacos/data
      - nacoslogs:/home/nacos/logs

volumes:
  pgdata:
  mysqldata:
  nacosdata:
  nacoslogs:
